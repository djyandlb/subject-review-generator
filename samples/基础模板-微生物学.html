<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{学科名}} {{副标题}}</title>
<!-- RV-TEMPLATE: 基础单文件模板 v1 | 数据: KNOWLEDGE_CATEGORIES + QUESTION_BANK | 配色: :root 变量 | 品牌: {{学科名}}/{{副标题}}/{{学科图标}} -->
<style>
:root{--bg-page:#f5f7fa;--bg-card:#ffffff;--bg-card-hover:#f0f4f8;--text-main:#1a1a2e;--text-light:#3d4f5f;--text-muted:#7a8a9a;--color-primary:#1a5276;--color-accent:#8e44ad;--color-header:#0d2b45;--color-correct:#27ae60;--color-wrong:#e74c3c;--color-master:#c0392b;--color-familiar:#d4a853;--color-understand:#4a90d9;--font-heading:'Georgia','Noto Serif SC',serif;--font-body:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;--sidebar-width:280px;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--shadow-card:0 1px 3px rgba(13,43,69,0.06),0 1px 2px rgba(13,43,69,0.04);--shadow-card-hover:0 4px 16px rgba(13,43,69,0.10),0 2px 4px rgba(13,43,69,0.06);--transition-fast:0.15s ease;--transition-normal:0.25s ease;--transition-slow:0.35s cubic-bezier(0.4,0,0.2,1);--color-border:#e0e6ed;--color-border-soft:#e8ecf1;--bg-sidebar:#f7f9fb;--bg-soft:#fafbfc;--header-rgb:13, 43, 69;--accent-rgb:142, 68, 173;--color-on-header:#fff;--color-correct-bg:#eafaf1;--color-wrong-bg:#fdecea;--color-master-bg:#ffeaea;--color-familiar-bg:#fff8e8;--color-understand-bg:#e8f1fa;--color-hint-bg:#fefdf0;--color-star:#f0c040;--color-correct-text:#1a6b3a;--color-wrong-text:#a51c1c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-body);color:var(--text-main);background:var(--bg-page);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul,ol{list-style:none}
img,svg{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--color-border-soft);border-radius:3px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--color-primary),var(--color-accent));border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:var(--color-primary) var(--color-border-soft)}
.app{display:grid;grid-template-columns:var(--sidebar-width) 1fr 370px;grid-template-rows:56px 1fr;grid-template-areas:"header header header" "sidebar main detail";height:100vh;overflow:hidden}
.app-header{grid-area:header;background:var(--color-header);color:var(--color-on-header);display:flex;align-items:center;padding:0 20px;gap:16px;box-shadow:0 2px 8px rgba(var(--header-rgb),0.30);z-index:100;position:relative}
.app-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary),var(--color-accent),var(--color-master))}
.app-sidebar{grid-area:sidebar;background:var(--bg-sidebar);border-right:1px solid var(--color-border);overflow-y:auto;overflow-x:hidden;padding:8px 0;display:flex;flex-direction:column}
.app-main{grid-area:main;padding:24px;overflow-y:auto;background:var(--bg-page)}
.app-detail{grid-area:detail;background:var(--bg-card);border-left:1px solid var(--color-border);overflow-y:auto;display:flex;flex-direction:column;box-shadow:-2px 0 12px rgba(var(--header-rgb),0.08)}
.header-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-size:1.2rem;font-weight:700;letter-spacing:.05em;white-space:nowrap;flex-shrink:1;overflow:hidden;min-width:0}
.header-brand .brand-icon{font-size:1.4rem;line-height:1;flex-shrink:0}
.header-brand .brand-accent{color:var(--color-accent)}
.header-brand .brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-search-wrap{position:relative;display:flex;align-items:center;margin-left:12px;height:34px;min-width:34px}
.search-trigger{position:absolute;left:0;top:0;display:flex;align-items:center;height:34px;padding:0 14px 0 34px;border-radius:34px;font-size:.875rem;font-weight:500;line-height:1;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);transition:opacity .15s ease;white-space:nowrap;z-index:2;cursor:pointer;box-sizing:border-box}
.search-trigger:hover{background:rgba(255,255,255,0.15);color:var(--color-on-header)}
.search-glass-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(255,255,255,0.6);pointer-events:none;z-index:5}
.search-input-inner{position:absolute;left:0;top:0;display:flex;align-items:center;height:34px}
.header-search-wrap input{width:80px;height:34px;padding:0 14px 0 34px;border:1px solid rgba(255,255,255,0.15);border-radius:34px;background:rgba(255,255,255,0.08);color:transparent;font-family:inherit;font-size:.875rem;font-weight:500;line-height:1;outline:none;transition:width .28s cubic-bezier(0.4,0,0.2,1),opacity .12s ease,border-color .25s ease,color 0s 0s;opacity:0;pointer-events:none;box-sizing:border-box}
.header-search-wrap input::placeholder{color:transparent;transition:color 0s 0s}
.header-search-wrap .search-clear{width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--color-on-header);font-size:.8rem;flex-shrink:0;margin-left:-28px}
.header-search-wrap.expanded .search-trigger{opacity:0;pointer-events:none;transition:opacity .08s ease}
.header-search-wrap.expanded input{width:220px;padding:0 8px 0 34px;opacity:1;pointer-events:auto;border-color:rgba(255,255,255,0.25);color:var(--color-on-header);transition:width .28s cubic-bezier(0.4,0,0.2,1),padding .28s cubic-bezier(0.4,0,0.2,1),opacity .12s ease,border-color .25s ease,color 0s .22s}
.header-search-wrap.expanded input::placeholder{color:rgba(255,255,255,0.5);transition:color 0s .22s}
.header-search-wrap.expanded input:focus{background:rgba(255,255,255,0.16);border-color:var(--color-accent)}
.header-search-wrap.expanded .search-clear{display:flex;opacity:.7;pointer-events:auto;transition:opacity .15s ease}
.header-search-wrap.expanded .search-clear:hover{opacity:1}
.header-search-wrap.expanded .search-clear.hidden{display:none}
.search-trigger .search-trigger-text{white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.btn-icon{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;font-size:.875rem;font-weight:500;transition:all var(--transition-fast);white-space:nowrap}
.btn-favorites{color:var(--color-on-header);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)}
.btn-favorites:hover{background:rgba(255,255,255,0.15)}
.btn-favorites.active{background:var(--color-accent);color:var(--color-on-header);border-color:var(--color-accent)}
.btn-quiz{color:var(--color-on-header);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)}
.btn-quiz:hover{background:rgba(255,255,255,0.18)}
.btn-hamburger{display:none;color:var(--color-on-header);padding:6px;border-radius:var(--radius-sm)}
.btn-hamburger:hover{background:rgba(255,255,255,0.1)}
.sidebar-mode-toggle{display:flex;margin:4px 8px 8px;background:var(--color-border-soft);border-radius:var(--radius-md);padding:3px;flex-shrink:0}
.sidebar-mode-btn{flex:1;padding:8px 4px;border-radius:var(--radius-sm);font-size:.8rem;font-weight:600;text-align:center;transition:all var(--transition-fast);color:var(--text-muted)}
.sidebar-mode-btn.active{background:var(--color-on-header);color:var(--color-primary);box-shadow:var(--shadow-card)}
.sidebar-mode-btn.knowledge-mode-btn.active{background:var(--color-on-header);color:var(--color-accent)}
.sidebar-heading{font-family:var(--font-heading);font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px 8px}
.sidebar-category{border-left:3px solid transparent;transition:all var(--transition-fast)}
.sidebar-category.active{border-left-color:var(--color-accent);background:#faf0fa}
.sidebar-category-header{display:flex;align-items:center;padding:9px 12px 9px 9px;gap:6px;cursor:pointer;user-select:none;transition:background var(--transition-fast)}
.sidebar-category-header:hover{background:rgba(var(--accent-rgb),0.06)}
.sidebar-arrow{width:14px;font-size:.55rem;color:var(--text-muted);flex-shrink:0;transition:transform var(--transition-fast);text-align:center}
.sidebar-category.expanded .sidebar-arrow{transform:rotate(90deg)}
.sidebar-category-info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.sidebar-icon{font-size:1rem;flex-shrink:0}
.sidebar-name{flex:1;font-size:.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-count{font-size:.65rem;color:var(--text-muted);background:var(--color-border-soft);padding:1px 7px;border-radius:10px;font-weight:500;flex-shrink:0}
.sidebar-subcategories{overflow:hidden;max-height:0;transition:max-height var(--transition-slow)}
.sidebar-category.expanded .sidebar-subcategories{max-height:600px}
.sidebar-subcategory{display:flex;align-items:center;padding:7px 16px 7px 32px;font-size:.8rem;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;gap:6px}
.sidebar-subcategory:hover{background:rgba(var(--accent-rgb),0.04);color:var(--color-primary)}
.sidebar-subcategory.active{color:var(--color-accent);background:rgba(var(--accent-rgb),0.07);border-left-color:var(--color-accent)}
.sidebar-question-tabs{display:flex;flex-direction:column;gap:2px;padding:0 8px;flex:1;overflow-y:auto}
.sidebar-qtab{display:flex;align-items:center;padding:10px 12px;border-radius:var(--radius-sm);font-size:.85rem;cursor:pointer;transition:all var(--transition-fast);gap:8px}
.sidebar-qtab:hover{background:rgba(var(--accent-rgb),0.05)}
.sidebar-qtab.active{background:#faf0fa;color:var(--color-accent);font-weight:600}
.sidebar-qtab .qtab-icon{font-size:1rem;flex-shrink:0}
.sidebar-qtab .qtab-count{font-size:.65rem;background:var(--color-border-soft);padding:1px 7px;border-radius:10px;margin-left:auto;flex-shrink:0}
.sidebar-wrongbook{border-top:2px solid var(--color-accent);margin-top:8px;padding-top:4px}
.sidebar-mobile-header{display:none;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--color-header);color:var(--color-on-header);border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-mobile-title{font-family:var(--font-heading);font-size:.95rem;font-weight:600}
.sidebar-mobile-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--color-on-header);font-size:1rem;transition:background var(--transition-fast)}
.sidebar-mobile-close:hover{background:rgba(255,255,255,0.15)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90}
.sidebar-overlay.show{display:block}
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(var(--header-rgb),0.45);z-index:94}
.main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.main-title{font-family:var(--font-heading);font-size:1.3rem;font-weight:700;color:var(--color-primary)}
.main-subtitle{font-size:.85rem;color:var(--text-muted)}
.mastery-filters{display:flex;gap:8px;flex-wrap:wrap}
.mastery-tag{padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:500;transition:all var(--transition-fast);border:1.5px solid var(--color-border);background:var(--color-on-header);color:var(--text-light)}
.mastery-tag:hover{border-color:var(--color-accent);color:var(--color-accent)}
.mastery-tag.active{color:var(--color-on-header);border-color:transparent;background:var(--color-primary)}
.mastery-tag.mastery-zhangwo.active{background:var(--color-master)}
.mastery-tag.mastery-shuxi.active{background:var(--color-familiar)}
.mastery-tag.mastery-lejie.active{background:var(--color-understand)}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.concept-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-card);transition:all var(--transition-normal);cursor:pointer;border:1px solid var(--color-border-soft);position:relative;overflow:hidden;min-width:0}
.concept-card:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-2px);border-color:var(--color-accent)}
.concept-card.is-key{border-left:3px solid var(--color-accent)}
.concept-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;min-width:0}
.concept-card-title{font-family:var(--font-heading);font-size:.95rem;font-weight:600;color:var(--text-main);line-height:1.4;min-width:0;word-break:break-word}
.concept-card-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:600;flex-shrink:0;line-height:1.6}
.badge-master{background:var(--color-master-bg);color:var(--color-master)}
.badge-familiar{background:var(--color-on-header)8e8;color:var(--color-familiar)}
.badge-understand{background:var(--color-understand-bg);color:var(--color-understand)}
.concept-card-summary{font-size:.8rem;color:var(--text-light);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.concept-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.concept-card-tags{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.concept-card-tag{font-size:.65rem;padding:2px 6px;border-radius:4px;background:#f0f4f8;color:var(--text-muted);white-space:nowrap}
.concept-card-star{border:none;background:none;cursor:pointer;font-size:1.1rem;color:#ddd;padding:2px 4px;transition:all var(--transition-fast);flex-shrink:0;line-height:1}
.concept-card-star:hover{color:var(--color-star);transform:scale(1.2)}
.concept-card-star.favorited{color:var(--color-star)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:3rem;margin-bottom:12px}
.empty-state-text{font-size:1rem}
.question-list-header{margin-bottom:20px}
.question-stats{font-size:.85rem;color:var(--text-muted);margin-top:4px}
.question-stats span{font-weight:700;color:var(--color-accent)}
.question-item{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);border:1px solid var(--color-border-soft);transition:all var(--transition-normal)}
.question-item:hover{box-shadow:var(--shadow-card-hover)}
.question-number{font-weight:700;color:var(--color-accent);font-family:var(--font-heading)}
.question-stem{font-size:.92rem;color:var(--text-main);margin-bottom:10px;line-height:1.6;font-weight:500}
.question-options{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.question-option{padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--color-border);font-size:.85rem;cursor:pointer;transition:all var(--transition-fast);background:var(--bg-soft);text-align:left}
.question-option:hover{border-color:var(--color-accent);background:rgba(var(--accent-rgb),0.04)}
.question-option.selected-correct{border-color:var(--color-correct);background:var(--color-correct-bg);color:var(--color-correct);font-weight:600}
.question-option.selected-wrong{border-color:var(--color-wrong);background:var(--color-wrong-bg);color:var(--color-wrong)}
.question-answer-reveal{display:none;margin-top:8px;padding:10px;background:var(--color-hint-bg);border-left:3px solid var(--color-familiar);border-radius:var(--radius-sm);font-size:.85rem;color:var(--text-light);line-height:1.6}
.question-answer-reveal.show{display:block}
.question-tf{display:flex;gap:8px;margin-bottom:8px}
.question-tf-btn{padding:8px 20px;border-radius:var(--radius-sm);border:1px solid var(--color-border);font-size:.85rem;cursor:pointer;transition:all var(--transition-fast);background:var(--bg-soft)}
.question-tf-btn:hover{border-color:var(--color-accent);background:rgba(var(--accent-rgb),0.04)}
.question-tf-btn.selected-correct{border-color:var(--color-correct);background:var(--color-correct-bg);color:var(--color-correct);font-weight:600}
.question-tf-btn.selected-wrong{border-color:var(--color-wrong);background:var(--color-wrong-bg);color:var(--color-wrong)}
.terminology-item{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);border:1px solid var(--color-border-soft);cursor:pointer;transition:all var(--transition-normal)}
.terminology-item:hover{box-shadow:var(--shadow-card-hover);border-color:var(--color-accent)}
.terminology-term{font-size:.95rem;font-weight:600;color:var(--color-primary);margin-bottom:4px}
.terminology-hint{font-size:.75rem;color:var(--text-muted)}
.terminology-answer{display:none;margin-top:10px;padding:12px;background:var(--color-hint-bg);border-left:3px solid var(--color-familiar);border-radius:var(--radius-sm);font-size:.85rem;color:var(--text-light);line-height:1.7}
.terminology-answer.show{display:block}
.app-detail-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--color-border);flex-shrink:0;background:var(--bg-soft)}
.app-detail-title{font-family:var(--font-heading);font-size:1.05rem;font-weight:700;color:var(--color-primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-detail-actions{display:flex;gap:6px;flex-shrink:0}
.btn-detail-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.9rem;color:var(--text-muted);transition:all var(--transition-fast)}
.btn-detail-close:hover{background:#f0f0f0;color:var(--text-main)}
.app-detail-content{padding:20px;flex:1;overflow-y:auto}
.app-detail-content ul,.app-detail-content ol{padding-left:20px;margin:8px 0}
.app-detail-content ul{list-style:disc}
.app-detail-content ol{list-style:decimal}
.app-detail-content li{margin-bottom:4px;font-size:.88rem;line-height:1.6}
.app-detail-content p{margin-bottom:8px;font-size:.88rem;line-height:1.7}
.app-detail-footer{display:none;padding:12px 16px;border-top:1px solid var(--color-border);background:var(--bg-card);flex-shrink:0}
.app-detail-back{width:100%;padding:14px;font-size:1rem;font-weight:600;color:var(--color-on-header);background:var(--color-header);border-radius:var(--radius-md);text-align:center;transition:all var(--transition-fast)}
.app-detail-back:hover{background:#1a3040}
.app-detail-content strong{color:var(--color-primary)}
.app-detail-empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:.9rem}
.app-detail-section{margin-top:16px;padding-top:12px;border-top:1px solid var(--color-border-soft)}
.app-detail-section-title{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;letter-spacing:.04em}
.detail-related-link{display:block;padding:8px 12px;margin-bottom:4px;border-radius:var(--radius-sm);font-size:.82rem;color:var(--color-accent);cursor:pointer;transition:all var(--transition-fast);background:rgba(var(--accent-rgb),0.04)}
.detail-related-link:hover{background:rgba(var(--accent-rgb),0.10)}
.detail-back-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;margin-bottom:8px;border:1px solid #c0c8d0;border-radius:14px;background:#f5f7fa;color:var(--text-light);font-size:.78rem;cursor:pointer;transition:all var(--transition-fast)}
.detail-back-btn:hover{background:var(--color-border-soft);border-color:var(--color-accent);color:var(--color-accent)}
.hidden{display:none!important}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:0 8px 40px rgba(var(--header-rgb),0.20);width:90%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--color-border);background:var(--bg-soft)}
.modal-title{font-family:var(--font-heading);font-size:1.1rem;font-weight:700;color:var(--color-primary)}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.9rem;color:var(--text-muted);transition:all var(--transition-fast)}
.modal-close:hover{background:#f0f0f0;color:var(--text-main)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--color-border);gap:10px;background:var(--bg-soft)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-light);margin-bottom:6px}
.form-input{width:100%;padding:8px 12px;border:1px solid #d0d6de;border-radius:var(--radius-sm);font-size:.9rem;outline:none;transition:border var(--transition-fast);font-family:inherit}
.form-input:focus{border-color:var(--color-accent)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:12px}
.checkbox-label{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.checkbox-label input[type="checkbox"]{accent-color:var(--color-accent);width:16px;height:16px}
.btn-primary{padding:10px 24px;border-radius:20px;font-size:.9rem;font-weight:600;background:var(--color-accent);color:var(--color-on-header);transition:all var(--transition-fast)}
.btn-primary:hover{background:#7d3b98;transform:translateY(-1px);box-shadow:0 4px 12px rgba(var(--accent-rgb),0.30)}
.btn-secondary{padding:10px 24px;border-radius:20px;font-size:.9rem;font-weight:500;background:var(--color-border-soft);color:var(--text-light);transition:all var(--transition-fast)}
.btn-secondary:hover{background:#d0d6de}
.quiz-progress{height:4px;background:var(--color-border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-accent));border-radius:2px;transition:width var(--transition-normal)}
.quiz-question-stem{font-size:1rem;font-weight:600;color:var(--text-main);margin-bottom:16px;line-height:1.6}
.quiz-feedback{margin-top:12px;padding:12px;border-radius:var(--radius-sm);font-size:.88rem;line-height:1.6}
.quiz-feedback.correct{background:var(--color-correct-bg);border-left:3px solid var(--color-correct);color:var(--color-correct-text)}
.quiz-feedback.wrong{background:var(--color-wrong-bg);border-left:3px solid var(--color-wrong);color:var(--color-wrong-text)}
.quiz-score{text-align:center;padding:40px 20px}
.quiz-score-value{font-size:3rem;font-weight:700;font-family:var(--font-heading);color:var(--color-accent)}
.quiz-score-label{font-size:1.1rem;color:var(--text-light);margin-top:8px}
/* Tablet landscape / medium desktop (≤1200px): 2-column + overlay detail */
@media (max-width: 1200px) {
  .app { grid-template-columns: 220px 1fr 320px; }
  .concept-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
}
/* Tablet portrait (≤1024px): sidebar overlay + detail overlay */
@media (max-width: 1024px) {
  .app { grid-template-columns: 220px 1fr; grid-template-areas: "header header" "sidebar main"; }
  .app-detail {
    display: none;
    position: fixed; top: 0; right: 0; bottom: 0; width: 370px; z-index: 150;
    box-shadow: -4px 0 24px rgba(var(--header-rgb),0.25);
  }
  .app-detail.show { display: flex; }
  .app-main { padding: 20px 16px; }
  .header-brand { font-size: 1.05rem; }
  .header-search-wrap { max-width: 220px; }
  .btn-hamburger { display: flex; }
  .sidebar-mobile-header { display: flex; }
  .btn-icon span { display: none; }
}
/* Phone (<768px): single column, full-screen overlays */
@media (max-width: 767px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas: "header" "main";
  }
  /* Sidebar: slide-in from left, below header */
  .app-sidebar {
    display: flex;
    position: fixed; top: 56px; left: 0; bottom: 0;
    width: 280px; z-index: 90;
    transform: translateX(-100%);
    transition: transform var(--transition-slow);
    box-shadow: 2px 0 20px rgba(var(--header-rgb),0.25);
  }
  .app-sidebar.show {
    transform: translateX(0);
  }
  .sidebar-overlay.show { display: block; }
  .sidebar-overlay { top: 56px; z-index: 85; }
  .sidebar-mobile-header { display: none; }
  /* Detail: full-screen overlay */
  .app-detail {
    display: none;
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    z-index: 151; flex-direction: column;
    box-shadow: -4px 0 20px rgba(var(--header-rgb),0.3);
    padding-top: env(safe-area-inset-top);
    border-left: none;
  }
  .app-detail.show { display: flex; }
  .app-detail-footer { display: block; }
  .detail-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(var(--header-rgb),0.45);
    z-index: 94;
  }
  .app-detail.show + .detail-overlay,
  .detail-overlay.show { display: block; }
  .app-detail-header { padding: 14px 16px; }
  /* Header compact */
  .app-header { padding: 0 10px; gap: 6px; }
  .btn-hamburger { display: flex; flex-shrink: 0; }
  .header-brand { font-size: .85rem; gap: 3px; width: auto; }
  .header-brand .brand-icon { font-size: .9rem; }
  .header-brand .brand-text { display: none; }
  .search-trigger { padding: 0 10px 0 34px; }
  .search-trigger .search-trigger-text { display: none; }
  .header-search-wrap { margin-left: 4px; }
  .header-search-wrap input { width: 44px; padding: 0 10px 0 34px; }
  .header-search-wrap.expanded input { width: 140px; }
  .btn-icon { padding: 6px 8px; font-size: .8rem; }
  .btn-icon span { display: none; }
  /* Main content */
  .app-main { padding: 16px 12px; }
  .concept-grid { grid-template-columns: 1fr; gap: 10px; }
  .concept-card { padding: 14px; }
  .concept-card-title { font-size: .9rem; }
  .concept-card-summary { font-size: .78rem; }
  .main-title { font-size: 1.1rem; }
  .main-subtitle { font-size: .75rem; }
  .mastery-filters { gap: 4px; }
  .mastery-tag { padding: 4px 10px; font-size: .72rem; }
  /* Questions on mobile */
  .question-item { padding: 12px; }
  .question-stem { font-size: .85rem; }
  .question-option { padding: 8px 10px; font-size: .82rem; }
  .question-tf-btn { padding: 8px 14px; }
  /* Modal */
  .modal { width: 95vw; max-width: 95vw; margin: 10px; max-height: 90vh; border-radius: var(--radius-md); }
  .modal-header { padding: 12px 16px; }
  .modal-body { padding: 16px; }
  /* Touch-friendly */
  button { touch-action: manipulation; }
  .concept-card-star { font-size: 1.3rem; padding: 4px; }
}
/* Small phone (≤380px) */
@media (max-width: 380px) {
  .header-brand { font-size: .78rem; }
  .header-brand .brand-icon { display: none; }
  .btn-icon { padding: 5px 6px; }
  .concept-card { padding: 10px; }
  .concept-card-title { font-size: .82rem; }
}
</style>

<body>

<div class="app" id="app">
  <!-- HEADER -->
  <header class="app-header">
    <button class="btn-hamburger" id="btnHamburger" title="菜单">☰</button>
    <div class="header-brand">
      <span class="brand-icon">{{学科图标}}</span>
      <span class="brand-text">{{学科名}} <span class="brand-accent">{{副标题}}</span></span>
    </div>
    <div class="header-search-wrap" id="searchWrap">
      <button class="search-trigger" id="searchTrigger" aria-label="搜索" title="搜索">
        <span class="search-trigger-text">搜索</span>
      </button>
      <svg class="search-glass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="search-input-inner">
        <input type="text" id="searchInput" placeholder="搜索知识点…" autocomplete="off" aria-label="搜索">
        <button class="search-clear hidden" id="searchClear" aria-label="清除搜索" title="清除">✕</button>
      </span>
    </div>
    <div class="header-actions">
      <button class="btn-icon btn-favorites" id="btnFavorites" title="收藏筛选">
        ★ <span>收藏</span> <span id="favCount" style="font-size:.7rem;background:rgba(255,255,255,0.2);padding:1px 6px;border-radius:10px;">0</span>
      </button>
      <button class="btn-icon btn-quiz" id="btnQuiz" title="刷题模式">
        📝 刷题
      </button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-mobile-header">
      <span class="sidebar-mobile-title">导航菜单</span>
      <button class="sidebar-mobile-close" id="sidebarClose">&times;</button>
    </div>
    <div class="sidebar-mode-toggle" id="sidebarModeToggle">
      <button class="sidebar-mode-btn knowledge-mode-btn active" data-mode="knowledge">📚 知识点</button>
      <button class="sidebar-mode-btn" data-mode="question">📝 题目</button>
    </div>
    <div id="sidebarTree"></div>
    <div id="sidebarQuestionTabs" class="hidden"></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="detail-overlay" id="detailOverlay"></div>

  <!-- MAIN -->
  <main class="app-main" id="mainContent"></main>

  <!-- DETAIL PANEL -->
  <aside class="app-detail" id="appDetail">
    <div class="app-detail-header">
      <span class="app-detail-title" id="detailTitle">详情</span>
      <div class="app-detail-actions">
        <button class="concept-card-star" id="detailStar" style="display:none;font-size:1.2rem;" title="收藏">★</button>
        <button class="btn-detail-close" id="detailClose" title="关闭">&times;</button>
      </div>
    </div>
    <div class="app-detail-content" id="detailBody">
      <div class="app-detail-empty">点击知识点或题目查看详情</div>
    </div>
    <div class="app-detail-footer">
      <button class="app-detail-back" id="detailBack" aria-label="返回列表">← 返回列表</button>
    </div>
  </aside>
</div>

<!-- Quiz Modal -->
<div class="modal-overlay" id="quizModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="quizModalTitle">刷题模式</span>
      <button class="modal-close" id="quizModalClose">&times;</button>
    </div>
    <div class="modal-body" id="quizModalBody"></div>
    <div class="modal-footer" id="quizModalFooter"></div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
// ── KNOWLEDGE CATEGORIES ──
const KNOWLEDGE_CATEGORIES = [
  // ============================================================
  // DATA: KNOWLEDGE_CATEGORIES — 知识点数据（模板化占位，按结构填充后即用）
  // 分类结构：{ id, name, icon, subcategories:[{id,name}], concepts:[{...}] }
  // 概念字段：id / title / subcategory(子分类id) / mastery(掌握|熟悉|了解) / summary(一句话) / content(HTML) / tags[] / isKey(必背)
  // 掌握度由资料判断写入，前端只读；isKey=true 为必背知识点（出题保证覆盖）
  // 填充示例（使用前删除）：
  // { id:"ch00", name:"第一章 绪论", icon:"🔬",
  //   subcategories:[{id:"ch00_0", name:"小节一"}, {id:"ch00_1", name:"小节二"}],
  //   concepts:[{ id:"k001", title:"知识点标题", subcategory:"ch00_0", mastery:"掌握",
  //     summary:"一句话摘要", content:"<p>正文，可含HTML</p>", tags:["标签"], isKey:true }] }
];

// ── QUESTION BANK ──
const QUESTION_BANK = {
  // ============================================================
  // DATA: QUESTION_BANK — 题库（模板化占位，按结构填充后即用）
  // 结构：choice / truefalse / terminology 各题型数组
  // 题目字段：id / stem(题干) / options[](选项) / answer / chapter(章节id) / explanation(解析) / cardId(关联知识点id)
  //   answer 类型：choice 正确选项索引(number)；truefalse 取值 对|错；terminology 名词解释(term + explanation/fullAnswer)
  // 填充示例（使用前删除）：
  //   choice: [{ id:"c001", stem:"题干", options:["A","B","C","D"], answer:1,
  //             chapter:"", explanation:"解析", cardId:"k001" }]
  choice: [],
  truefalse: [],
  terminology: []
};

// ============================================================
// STATE
// ============================================================
const STORAGE_FAV = 'microbio_favorites';
const STORAGE_WRONG = 'microbio_wrongbook';
// 提示：使用前将 STORAGE_FAV / STORAGE_WRONG 前缀改为本学科标识，避免多学科数据串用

const state = {
  sidebarMode: 'knowledge',
  questionTab: 'choice',
  activeCategoryId: null,
  activeSubcategoryId: null,
  searchQuery: '',
  showFavoritesOnly: false,
  expandedCategories: new Set(['ch00']),
  masteryFilter: null,
  favorites: [],
  wrongBook: [],
  sidebarOpen: false,
  selectedDetail: null,
  detailHistory: [],  // stack for back-navigation: [{type, id, qtype}]
  quizState: null,
};

// ============================================================
// DOM REFS
// ============================================================
const $ = (sel) => document.querySelector(sel);
const dom = {};
function initDom() {
  dom.sidebar = $('#sidebar');
  dom.sidebarTree = $('#sidebarTree');
  dom.sidebarQuestionTabs = $('#sidebarQuestionTabs');
  dom.sidebarOverlay = $('#sidebarOverlay');
  dom.detailOverlay = $('#detailOverlay');
  dom.mainContent = $('#mainContent');
  dom.searchWrap = $('#searchWrap');
  dom.searchTrigger = $('#searchTrigger');
  dom.searchInput = $('#searchInput');
  dom.searchClear = $('#searchClear');
  dom.btnFavorites = $('#btnFavorites');
  dom.btnHamburger = $('#btnHamburger');
  dom.btnQuiz = $('#btnQuiz');
  dom.favCount = $('#favCount');
  dom.appDetail = $('#appDetail');
  dom.detailBody = $('#detailBody');
  dom.detailTitle = $('#detailTitle');
  dom.detailStar = $('#detailStar');
  dom.detailClose = $('#detailClose');
  dom.detailBack = $('#detailBack');
  dom.quizModalOverlay = $('#quizModalOverlay');
  dom.quizModalBody = $('#quizModalBody');
  dom.quizModalFooter = $('#quizModalFooter');
  dom.quizModalClose = $('#quizModalClose');
  dom.quizModalTitle = $('#quizModalTitle');
  dom.sidebarModeToggle = $('#sidebarModeToggle');
}

// ============================================================
// DATA ACCESS
// ============================================================
function getCategories() {
  return (typeof KNOWLEDGE_CATEGORIES !== 'undefined' && Array.isArray(KNOWLEDGE_CATEGORIES)) ? KNOWLEDGE_CATEGORIES : [];
}
function getCategoryById(id) {
  return getCategories().find(c => c.id === id);
}
function getAllConceptsFlat() {
  const all = [];
  for (const cat of getCategories()) {
    for (const c of (cat.concepts || [])) {
      all.push({ ...c, chapterId: cat.id, chapterName: cat.name });
    }
  }
  return all;
}
function getConceptById(id) {
  for (const cat of getCategories()) {
    const found = (cat.concepts || []).find(c => c.id === id);
    if (found) return { ...found, chapterId: cat.id, chapterName: cat.name };
  }
  return null;
}
function getQuestionBank() {
  return (typeof QUESTION_BANK !== 'undefined') ? QUESTION_BANK : { choice:[], truefalse:[], terminology:[] };
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function loadFavorites() {
  try { const raw = localStorage.getItem(STORAGE_FAV); state.favorites = raw ? JSON.parse(raw) : []; } catch (e) { state.favorites = []; }
}
function saveFavorites() {
  try { localStorage.setItem(STORAGE_FAV, JSON.stringify(state.favorites)); } catch (e) {}
}
function isFavorite(id) { return state.favorites.includes(id); }
function toggleFavorite(id) {
  const idx = state.favorites.indexOf(id);
  if (idx >= 0) { state.favorites.splice(idx, 1); } else { state.favorites.push(id); }
  saveFavorites(); updateFavCount();
}
function updateFavCount() { if (dom.favCount) dom.favCount.textContent = state.favorites.length; }

// Wrong book
function loadWrongBook() {
  try { const raw = localStorage.getItem(STORAGE_WRONG); state.wrongBook = raw ? JSON.parse(raw) : []; } catch (e) { state.wrongBook = []; }
}
function saveWrongBook() {
  try { localStorage.setItem(STORAGE_WRONG, JSON.stringify(state.wrongBook)); } catch (e) {}
}
function addToWrongBook(qid) {
  if (!state.wrongBook.includes(qid)) {
    state.wrongBook.push(qid);
    saveWrongBook();
  }
}
function removeFromWrongBook(qid) {
  state.wrongBook = state.wrongBook.filter(id => id !== qid);
  saveWrongBook();
}
function clearWrongBook() {
  state.wrongBook = [];
  saveWrongBook();
  renderAll();
}

// ============================================================
// SEARCH
// ============================================================
let searchTimer = null;

function expandSearch() {
  if (dom.searchWrap.classList.contains('expanded')) return;
  dom.searchWrap.classList.add('expanded');
  setTimeout(() => { dom.searchInput.focus(); }, 250);
}

function collapseSearch() {
  if (!state.searchQuery && !dom.searchInput.value.trim()) {
    dom.searchWrap.classList.remove('expanded');
  }
}

function handleSearchInput() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = dom.searchInput.value.trim();
    if (state.searchQuery) {
      dom.searchClear.classList.remove('hidden');
    } else {
      dom.searchClear.classList.add('hidden');
    }
    renderMain();
  }, 200);
}

function handleSearchClear() {
  state.searchQuery = '';
  dom.searchInput.value = '';
  dom.searchClear.classList.add('hidden');
  renderAll();
  dom.searchInput.focus();
  setTimeout(() => collapseSearch(), 200);
}

// ============================================================
// FUZZY SEARCH
// ============================================================
function fuzzyMatch(text, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  let qi = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) qi++;
  }
  return qi === q.length;
}
function conceptMatchesSearch(concept, query) {
  if (!query) return true;
  const contentText = (concept.content || '').replace(/<[^>]*>/g, '');
  return fuzzyMatch(concept.title || '', query) ||
    fuzzyMatch(concept.summary || '', query) ||
    fuzzyMatch(contentText, query) ||
    (concept.tags || []).some(t => fuzzyMatch(t, query));
}
function questionMatchesSearch(q, query) {
  if (!query) return true;
  return fuzzyMatch(q.stem || q.term || '', query) ||
    fuzzyMatch((q.options || []).join(' '), query) ||
    fuzzyMatch(q.explanation || q.fullAnswer || '', query);
}

// ============================================================
// FILTERING
// ============================================================
function getFilteredConcepts() {
  const categories = getCategories();
  let concepts = [];
  if (state.showFavoritesOnly || state.searchQuery) {
    for (const cat of categories) {
      for (const c of (cat.concepts || [])) { concepts.push({ ...c, chapterId: cat.id, chapterName: cat.name }); }
    }
  } else if (state.activeCategoryId) {
    const category = getCategoryById(state.activeCategoryId);
    if (category) {
      for (const c of (category.concepts || [])) { concepts.push({ ...c, chapterId: category.id, chapterName: category.name }); }
    }
  } else {
    for (const cat of categories) {
      for (const c of (cat.concepts || [])) { concepts.push({ ...c, chapterId: cat.id, chapterName: cat.name }); }
    }
  }
  if (state.searchQuery) { concepts = concepts.filter(c => conceptMatchesSearch(c, state.searchQuery)); }
  if (state.activeSubcategoryId && !state.showFavoritesOnly && !state.searchQuery) {
    const activeCategory = getCategoryById(state.activeCategoryId);
    let subName = null;
    if (activeCategory && activeCategory.subcategories) {
      const sub = activeCategory.subcategories.find(s => s.id === state.activeSubcategoryId);
      if (sub) subName = sub.name;
    }
    if (subName) { concepts = concepts.filter(c => (c.subcategory || '') === subName); } else { concepts = []; }
  }
  if (state.showFavoritesOnly) { concepts = concepts.filter(c => isFavorite('concept_' + c.id)); }
  if (state.masteryFilter) { concepts = concepts.filter(c => c.mastery === state.masteryFilter); }
  return concepts;
}
function getFilteredQuestions(type) {
  const bank = getQuestionBank();
  let questions = (bank[type] || []).slice();
  if (state.activeCategoryId) { questions = questions.filter(q => (q.chapter || '') === state.activeCategoryId); }
  if (state.searchQuery) { questions = questions.filter(q => questionMatchesSearch(q, state.searchQuery)); }
  if (state.showFavoritesOnly) { questions = questions.filter(q => isFavorite('q_' + q.id)); }
  return questions;
}

// ============================================================
// RENDER: SIDEBAR
// ============================================================
function renderSidebar() {
  if (state.sidebarMode === 'knowledge') { renderKnowledgeSidebar(); }
  else { renderQuestionSidebar(); }
}
function renderKnowledgeSidebar() {
  if (dom.sidebarTree) dom.sidebarTree.classList.remove('hidden');
  if (dom.sidebarQuestionTabs) dom.sidebarQuestionTabs.classList.add('hidden');
  const categories = getCategories();
  let html = '<div class="sidebar-heading">章节导航</div>';
  for (const cat of categories) {
    const isActive = state.activeCategoryId === cat.id;
    const isExpanded = state.expandedCategories.has(cat.id);
    const conceptCount = (cat.concepts || []).length;
    html += '<div class="sidebar-category ' + (isActive ? 'active' : '') + ' ' + (isExpanded ? 'expanded' : '') + '" data-cat-id="' + cat.id + '">';
    html += '<div class="sidebar-category-header">';
    html += '<span class="sidebar-arrow">&#9654;</span>';
    html += '<div class="sidebar-category-info">';
    html += '<span class="sidebar-icon">' + (cat.icon || '') + '</span>';
    html += '<span class="sidebar-name">' + cat.name + '</span>';
    html += '<span class="sidebar-count">' + conceptCount + '</span>';
    html += '</div></div>';
    html += '<div class="sidebar-subcategories">';
    if (cat.subcategories) {
      for (const sub of cat.subcategories) {
        const subIsActive = state.activeSubcategoryId === sub.id;
        html += '<div class="sidebar-subcategory ' + (subIsActive ? 'active' : '') + '" data-sub-id="' + sub.id + '" data-cat-id="' + cat.id + '">';
        html += '<span>' + sub.name + '</span></div>';
      }
    }
    html += '</div></div>';
  }
  if (dom.sidebarTree) dom.sidebarTree.innerHTML = html;
}
function renderQuestionSidebar() {
  if (dom.sidebarTree) dom.sidebarTree.classList.add('hidden');
  if (dom.sidebarQuestionTabs) dom.sidebarQuestionTabs.classList.remove('hidden');
  const bank = getQuestionBank();
  const wbCount = state.wrongBook.length;
  const tabs = [
    { id: 'choice', label: '选择题', icon: '📋', count: (bank.choice || []).length },
    { id: 'truefalse', label: '判断题', icon: '✅', count: (bank.truefalse || []).length },
    { id: 'terminology', label: '名词解释', icon: '📖', count: (bank.terminology || []).length },
  ];
  let html = '<div class="sidebar-heading">题型分类</div>';
  for (const tab of tabs) {
    const isActive = state.questionTab === tab.id;
    html += '<div class="sidebar-qtab ' + (isActive ? 'active' : '') + '" data-qt="' + tab.id + '">';
    html += '<span class="qtab-icon">' + tab.icon + '</span>';
    html += '<span>' + tab.label + '</span>';
    html += '<span class="qtab-count">' + tab.count + '</span>';
    html += '</div>';
  }
  // Wrong book tab
  const wbActive = state.questionTab === 'wrongbook';
  html += '<div class="sidebar-qtab sidebar-wrongbook ' + (wbActive ? 'active' : '') + '" data-qt="wrongbook">';

function renderMainQuestions() {

    }

    questions = getFilteredQuestions(state.questionTab);

  } else {

        html += '<div class="question-options">';

        html += '</div>';
      } else if (qtype === 'truefalse') {
        html += '<div class="question-item" data-qid="' + q.id + '" data-qtype="truefalse">';
        html += '<div class="question-stem"><span class="question-number">' + (i + 1) + '.</span> ' + q.stem + '</div>';
        html += '<div class="question-tf">';

        html += '</div>';
        html += '<div class="question-answer-reveal"><strong>答案：' + (q.answer === '对' ? '✓ 正确' : '✗ 错误') + '</strong><br>📖 ' + (q.explanation || '') + '</div>';
        html += rmBtn;
        html += '</div>';
      } else if (qtype === 'terminology') {
        html += '<div class="terminology-item" data-qid="' + q.id + '" data-qtype="terminology">';

  }

}

// QUIZ MODAL
// ============================================================
function openQuizModal() {
  dom.quizModalTitle.textContent = '刷题模式';
  dom.quizModalBody.innerHTML = '<div class="form-group"><label class="form-label">题目数量</label><input type="number" class="form-input" id="quizCount" value="20" min="1" max="200"></div><div class="form-group"><label class="form-label">题目类型</label><div class="checkbox-group"><label class="checkbox-label"><input type="checkbox" value="choice" checked> 选择题</label><label class="checkbox-label"><input type="checkbox" value="truefalse" checked> 判断题</label><label class="checkbox-label"><input type="checkbox" value="terminology"> 名词解释</label></div></div>';
  dom.quizModalFooter.innerHTML = '<button class="btn-secondary" id="quizModalCancel">取消</button><button class="btn-primary" id="quizModalStart">开始答题</button>';
  dom.quizModalOverlay.classList.add('show');
  document.getElementById('quizModalCancel').onclick = closeQuizModal;
  document.getElementById('quizModalStart').onclick = startQuiz;
}
function closeQuizModal() {
  dom.quizModalOverlay.classList.remove('show');
  state.quizState = null;
}
function startQuiz() {
  const count = parseInt(document.getElementById('quizCount').value) || 20;
  const types = [];
  document.querySelectorAll('#quizModalBody input[type="checkbox"]:checked').forEach(cb => types.push(cb.value));
  if (types.length === 0) { alert('请选择至少一种题型'); return; }
  const bank = getQuestionBank();
  let pool = [];
  for (const t of types) {
    if (bank[t]) pool = pool.concat(bank[t].map(q => ({ ...q, _type: t })));
  }
  pool = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
  state.quizState = { questions: pool, currentIndex: 0, answers: [], finished: false };
  showQuizQuestion();
}
function showQuizQuestion() {
  const qs = state.quizState;
  if (qs.currentIndex >= qs.questions.length) { showQuizResult(); return; }
  const q = qs.questions[qs.currentIndex];
  const progress = ((qs.currentIndex) / qs.questions.length * 100);
  dom.quizModalTitle.textContent = '刷题模式 (' + (qs.currentIndex + 1) + '/' + qs.questions.length + ')';
  let bodyHtml = '<div class="quiz-progress"><div class="quiz-progress-bar" style="width:' + progress + '%"></div></div>';
  bodyHtml += '<div class="quiz-question"><div class="quiz-question-stem">' + (qs.currentIndex + 1) + '. ' + (q.stem || q.term) + '</div>';
  if (q._type === 'choice') {
    const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    bodyHtml += '<div class="question-options">';
    for (let j = 0; j < (q.options || []).length; j++) {
      bodyHtml += '<button class="question-option quiz-opt" data-opt="' + j + '" style="text-align:left;width:100%;">' + labels[j] + '. ' + q.options[j] + '</button>';
    }
    bodyHtml += '</div>';
  } else if (q._type === 'truefalse') {
    bodyHtml += '<div class="question-tf"><button class="question-tf-btn tf-true quiz-opt" data-opt="0" style="flex:1;">✓ 正确</button><button class="question-tf-btn tf-false quiz-opt" data-opt="1" style="flex:1;">✗ 错误</button></div>';
  } else if (q._type === 'terminology') {
    bodyHtml += '<div style="margin-bottom:10px;font-size:0.85rem;color:var(--text-muted);">名词解释题 — 先回忆，再查看答案</div>';
    bodyHtml += '<button class="btn-secondary quiz-opt" data-opt="0" style="width:100%;">📖 显示答案</button>';
    bodyHtml += '<div id="quizTermAnswer" style="margin-top:10px;display:none;padding:12px;background:#fefdf0;border-left:3px solid var(--color-familiar);border-radius:var(--radius-sm);font-size:0.88rem;line-height:1.7;">' + (q.fullAnswer || q.explanation || '') + '</div>';
  }
  bodyHtml += '<div id="quizFeedback" style="margin-top:10px;"></div></div>';
  dom.quizModalBody.innerHTML = bodyHtml;
  dom.quizModalFooter.innerHTML = '<span style="font-size:0.85rem;color:var(--text-muted);">' + (qs.currentIndex + 1) + ' / ' + qs.questions.length + '</span><button class="btn-secondary" id="quizSkip">跳过</button><button class="btn-primary hidden" id="quizNext">下一题</button>';
  document.getElementById('quizSkip').onclick = () => {
    state.quizState.answers.push(null);
    state.quizState.currentIndex++;
    showQuizQuestion();
  };
  document.querySelectorAll('.quiz-opt').forEach(opt => {
    opt.onclick = function() {
      if (q._type === 'terminology') {
        const answerDiv = document.getElementById('quizTermAnswer');
        if (answerDiv) answerDiv.style.display = 'block';
        // For terminology, user self-assesses
        state.quizState.answers.push(null); // null = self-assessed
        document.getElementById('quizSkip').classList.add('hidden');
        const nextBtn = document.getElementById('quizNext');
        nextBtn.classList.remove('hidden');
        nextBtn.onclick = () => { state.quizState.currentIndex++; showQuizQuestion(); };
        // Add self-assess buttons
        const fb = document.getElementById('quizFeedback');
        fb.innerHTML = '<div style="margin-top:12px;display:flex;gap:10px;justify-content:center;"><span style="font-size:0.85rem;color:var(--text-muted);margin-right:8px;">自我评估：</span><button class="btn-secondary" id="quizSelfCorrect" style="padding:6px 16px;font-size:.8rem;">✓ 答对了</button><button class="btn-secondary" id="quizSelfWrong" style="padding:6px 16px;font-size:.8rem;">✗ 答错了</button></div>';
        document.getElementById('quizSelfCorrect').onclick = () => {
          const idx = qs.answers.length - 1;
          if (idx >= 0) qs.answers[idx] = true;
        };
        document.getElementById('quizSelfWrong').onclick = () => {
          const idx = qs.answers.length - 1;
          if (idx >= 0) { qs.answers[idx] = false; addToWrongBook(q.id); }
        };
        return;
      }
      const chosen = parseInt(this.dataset.opt);
      const correct = q._type === 'choice' ? q.answer : (q.answer === '对' ? 0 : 1);
      const isCorrect = chosen === correct;
      state.quizState.answers.push(isCorrect);
      if (!isCorrect) addToWrongBook(q.id);
      document.querySelectorAll('.quiz-opt').forEach(o => {
        const val = parseInt(o.dataset.opt);
        if (val === correct) o.classList.add('selected-correct');
        if (val === chosen && !isCorrect) o.classList.add('selected-wrong');
        o.style.pointerEvents = 'none';
      });
      const fb = document.getElementById('quizFeedback');
      fb.innerHTML = '<div class="quiz-feedback ' + (isCorrect ? 'correct' : 'wrong') + '"><strong>' + (isCorrect ? '✓ 正确！' : ('✗ 错误！正确答案是 ' + (q._type === 'choice' ? 'ABCDEFGH'[q.answer] + '. ' + q.options[q.answer] : (q.answer === '对' ? '正确' : '错误')))) + '</strong><br>📖 ' + (q.explanation || '') + '</div>';
      document.getElementById('quizSkip').classList.add('hidden');
      const nextBtn = document.getElementById('quizNext');
      nextBtn.classList.remove('hidden');
      nextBtn.onclick = () => { state.quizState.currentIndex++; showQuizQuestion(); };
    };
  });
}
function showQuizResult() {
  const qs = state.quizState;
  const total = qs.answers.length;
  // Only count non-null answers for terminology self-assessed
  const correct = qs.answers.filter(a => a === true).length;
  const selfAssessed = qs.answers.filter(a => a === null).length;
  const effective = total - selfAssessed;
  const pct = effective > 0 ? Math.round(correct / effective * 100) : 0;
  dom.quizModalTitle.textContent = '答题结果';
  let feedback = pct >= 80 ? '🌟 优秀！知识点掌握得很好！' : (pct >= 60 ? '👍 良好，继续加油！' : '📚 需要加强复习哦！');
  dom.quizModalBody.innerHTML = '<div class="quiz-score"><div class="quiz-score-value">' + correct + '/' + effective + '</div><div class="quiz-score-label">正确率 ' + pct + '%</div><div style="margin-top:12px;font-size:0.9rem;color:var(--text-light);">' + feedback + (selfAssessed > 0 ? '<br><span style="font-size:0.8rem;color:var(--text-muted);">（' + selfAssessed + ' 道名词解释为自我评估）</span>' : '') + '</div></div>';
  dom.quizModalFooter.innerHTML = '<button class="btn-secondary" id="quizRetry">再来一次</button><button class="btn-primary" id="quizClose">关闭</button>';
  document.getElementById('quizRetry').onclick = () => { state.quizState = null; openQuizModal(); };
  document.getElementById('quizClose').onclick = closeQuizModal;
  // Refresh sidebar to update wrong book count
  renderSidebar();
}

let searchTimeout = null;
function handleSearchInput() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.searchQuery = dom.searchInput.value.trim();
    if (state.searchQuery) { dom.searchClear.classList.remove('hidden'); }
    else { dom.searchClear.classList.add('hidden'); }
    renderAll();
  }, 200);
}
function handleSearchClear() {
  dom.searchInput.value = '';
  state.searchQuery = '';
  dom.searchClear.classList.add('hidden');
  renderAll();
  dom.searchInput.focus();
  setTimeout(() => collapseSearch(), 200);
}
function handleFavoritesToggle() {
  state.showFavoritesOnly = !state.showFavoritesOnly;
  if (dom.btnFavorites) dom.btnFavorites.classList.toggle('active', state.showFavoritesOnly);
  renderAll();
}
function handleSidebarClick(e) {
  const target = e.target;
  const header = target.closest('.sidebar-category-header');
  if (header) {
    const catDiv = header.closest('.sidebar-category');
    const catId = catDiv.dataset.catId;
    if (state.activeCategoryId === catId && state.expandedCategories.has(catId)) { state.expandedCategories.delete(catId); }
    else { state.expandedCategories.add(catId); }
    state.activeCategoryId = catId;
    state.activeSubcategoryId = null;
    state.showFavoritesOnly = false;
    if (dom.btnFavorites) dom.btnFavorites.classList.remove('active');
    renderAll();
    return;
  }
  const sub = target.closest('.sidebar-subcategory');
  if (sub) {
    state.activeCategoryId = sub.dataset.catId;
    state.activeSubcategoryId = sub.dataset.subId;
    state.showFavoritesOnly = false;
    if (dom.btnFavorites) dom.btnFavorites.classList.remove('active');
    renderAll();
    return;
  }
  const qtab = target.closest('.sidebar-qtab');
  if (qtab) {
    state.questionTab = qtab.dataset.qt;
    if (state.questionTab === 'wrongbook') {
      state.activeCategoryId = null;
    }
    renderAll();
    return;
  }
}
function handleMainClick(e) {
  const starBtn = e.target.closest('[data-star-concept]');
  if (starBtn) { e.stopPropagation(); toggleFavorite('concept_' + starBtn.dataset.starConcept); renderAll(); return; }
  const card = e.target.closest('.concept-card');
  if (card) { state.selectedDetail = { type: 'concept', id: card.dataset.conceptId }; state.detailHistory = []; renderDetailPanel(); return; }
  const opt = e.target.closest('.question-option');
  if (opt && !opt.classList.contains('quiz-opt')) {
    const qItem = opt.closest('.question-item');
    const qid = qItem.dataset.qid;
    const chosen = parseInt(opt.dataset.opt);
    const bank = getQuestionBank();
    const q = (bank.choice || []).find(q => q.id === qid);
    if (!q) return;
    const allOpts = qItem.querySelectorAll('.question-option');
    const correct = q.answer;
    allOpts.forEach(o => {
      const val = parseInt(o.dataset.opt);
      if (val === correct) o.classList.add('selected-correct');
      if (val === chosen && chosen !== correct) o.classList.add('selected-wrong');
      o.style.pointerEvents = 'none';
    });
    const reveal = qItem.querySelector('.question-answer-reveal');
    if (reveal) reveal.classList.add('show');
    return;
  }
  const tfBtn = e.target.closest('.question-tf-btn');
  if (tfBtn) {
    const qItem = tfBtn.closest('.question-item');
    const qid = qItem.dataset.qid;
    const chosen = parseInt(tfBtn.dataset.opt) === 0;
    const bank = getQuestionBank();
    const q = (bank.truefalse || []).find(q => q.id === qid);
    if (!q) return;
    const allTf = qItem.querySelectorAll('.question-tf-btn');
    allTf.forEach(b => {
      const val = parseInt(b.dataset.opt) === 0;
      if (val === q.answer) b.classList.add('selected-correct');
      if (val === chosen && chosen !== q.answer) b.classList.add('selected-wrong');
      b.style.pointerEvents = 'none';
    });
    const reveal = qItem.querySelector('.question-answer-reveal');
    if (reveal) reveal.classList.add('show');
    return;
  }
  const termItem = e.target.closest('.terminology-item');
  if (termItem) {
    const answer = termItem.querySelector('.terminology-answer');
    if (answer) answer.classList.toggle('show');
    return;
  }
  const mtag = e.target.closest('.mastery-tag');
  if (mtag) {
    state.masteryFilter = mtag.dataset.mastery || null;
    renderMain();
    return;
  }
  const relLink = e.target.closest('.detail-related-link');
  if (relLink) {
    // Save current concept to history before navigating to question
    if (state.selectedDetail && state.selectedDetail.type === 'concept') {
      state.detailHistory.push({ ...state.selectedDetail });
    }
    state.selectedDetail = { type: 'question', id: relLink.dataset.qid, qtype: relLink.dataset.qtype };
    renderDetailPanel();
    return;
  }
  // Back button in detail panel
  const backBtn = e.target.closest('.detail-back-btn');
  if (backBtn) {
    if (state.detailHistory.length > 0) {
      state.selectedDetail = state.detailHistory.pop();
    } else {
      state.selectedDetail = null;
    }
    renderDetailPanel();
    return;
  }
}
function handleModeToggle(e) {
  const btn = e.target.closest('.sidebar-mode-btn');
  if (!btn) return;
  state.sidebarMode = btn.dataset.mode;
  state.activeCategoryId = null;
  state.activeSubcategoryId = null;
  state.masteryFilter = null;
  state.selectedDetail = null;
  state.showFavoritesOnly = false;
  if (dom.btnFavorites) dom.btnFavorites.classList.remove('active');
  document.querySelectorAll('.sidebar-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.sidebarMode));
  renderAll();
}
function toggleMobileSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  if (state.sidebarOpen) {
    dom.sidebar.classList.add('show');
    dom.sidebarOverlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  } else {
    closeMobileSidebar();
  }
}
function closeMobileSidebar() {
  state.sidebarOpen = false;
  dom.sidebar.classList.remove('show');
  dom.sidebarOverlay.classList.remove('show');
  document.body.style.overflow = '';
}
function handleDetailClose() { closeDetail(); }
function handleDetailStar(e) {
  const starBtn = e.target.closest('[data-star-concept]');
  if (starBtn) { toggleFavorite('concept_' + starBtn.dataset.starConcept); renderDetailPanel(); }
}
function handleWindowResize() {
  if (window.innerWidth > 1024) {
    dom.appDetail.classList.remove('show');
    dom.detailOverlay.style.display = 'none';
    dom.sidebar.classList.remove('show');
    dom.sidebarOverlay.classList.remove('show');
    document.body.style.overflow = '';
    state.sidebarOpen = false;
  }
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  renderSidebar();
  renderMain();
  if (state.selectedDetail) { renderDetailPanel(); }
  else { if (window.innerWidth <= 1024) { dom.appDetail.classList.remove('show'); dom.detailOverlay.style.display = 'none'; } }
  updateFavCount();
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  initDom();
  loadFavorites();
  loadWrongBook();
  updateFavCount();
  if (dom.sidebarTree) dom.sidebarTree.addEventListener('click', handleSidebarClick);
  if (dom.sidebarQuestionTabs) dom.sidebarQuestionTabs.addEventListener('click', handleSidebarClick);
  if (dom.mainContent) dom.mainContent.addEventListener('click', handleMainClick);
  if (dom.detailBody) dom.detailBody.addEventListener('click', handleMainClick);
  // Search events
  if (dom.searchInput) dom.searchInput.addEventListener('input', handleSearchInput);
  if (dom.searchClear) dom.searchClear.addEventListener('click', handleSearchClear);
  if (dom.searchTrigger) dom.searchTrigger.addEventListener('click', expandSearch);
  if (dom.searchInput) dom.searchInput.addEventListener('blur', function(e) {
    const related = e.relatedTarget;
    if (related && related.closest('#searchWrap')) return;
    if (state.searchQuery || dom.searchInput.value.trim()) return;
    setTimeout(() => collapseSearch(), 200);
  });
  if (dom.searchInput) dom.searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !state.searchQuery) {
      dom.searchInput.value = '';
      dom.searchWrap.classList.remove('expanded');
      dom.searchInput.blur();
    }
  });
  // Other events
  if (dom.btnFavorites) dom.btnFavorites.addEventListener('click', handleFavoritesToggle);
  if (dom.btnHamburger) dom.btnHamburger.addEventListener('click', toggleMobileSidebar);
  if (dom.sidebarOverlay) dom.sidebarOverlay.addEventListener('click', closeMobileSidebar);
  if (dom.detailOverlay) dom.detailOverlay.addEventListener('click', closeDetail);
  if (dom.btnQuiz) dom.btnQuiz.addEventListener('click', openQuizModal);
  if (dom.detailClose) dom.detailClose.addEventListener('click', handleDetailClose);
  if (dom.detailBack) dom.detailBack.addEventListener('click', handleDetailClose);
  if (dom.detailStar) dom.detailStar.addEventListener('click', handleDetailStar);
  if (dom.quizModalClose) dom.quizModalClose.addEventListener('click', closeQuizModal);
  if (dom.quizModalOverlay) dom.quizModalOverlay.addEventListener('click', function(e) { if (e.target === dom.quizModalOverlay) closeQuizModal(); });
  if (dom.sidebarModeToggle) dom.sidebarModeToggle.addEventListener('click', handleModeToggle);
  const sidebarClose = document.getElementById('sidebarClose');
  if (sidebarClose) sidebarClose.addEventListener('click', closeMobileSidebar);
  // Global keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Ctrl+K or / to focus search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      expandSearch();
    }
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
      e.preventDefault();
      expandSearch();
    }
    // Escape: quiz > detail > sidebar > search
    if (e.key === 'Escape') {
      if (state.quizState) { closeQuizModal(); return; }
      if (state.selectedDetail) { closeDetail(); return; }
      if (state.sidebarOpen) { closeMobileSidebar(); return; }
      if (state.searchQuery) { handleSearchClear(); return; }
    }
  });
  window.addEventListener('resize', handleWindowResize);
  renderAll();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
